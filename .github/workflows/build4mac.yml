name: Build Mac ARM64 from Nightly

on:
  # Scheduled trigger temporarily disabled — the self-hosted runner workflow
  # (build4mac_local.yml) is handling the every-4-days cadence instead.
  # Restore by uncommenting the lines below.
  # schedule:
  #   - cron: '0 2 1,5,9,13,17,21,25,29 * *' # Run every 4 days at 2 AM UTC
  workflow_dispatch: # Allow manual trigger
  
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_mac_arm64:
    name: Build Mac ARM64
    runs-on: macos-14
    permissions:
      contents: write
    env:
      date:
      ver:
      ver_pure:
    
    steps:
      - name: Validate PAT token secret
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::PAT_TOKEN secret is not set. Create a PAT with 'repo' and 'workflow' scopes and add it as PAT_TOKEN in repository secrets."
            echo "Repository secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Checkout nightly-builds-with-bc branch
        uses: actions/checkout@v5
        with:
          ref: nightly-builds-with-bc
          fetch-depth: 0
          lfs: 'true'
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Fetch and merge upstream nightly-builds
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: nightly-builds-with-bc
        run: |
          # -e is the Actions default for `run:`; state it explicitly so the script does not depend on it.
          set -euo pipefail

          # Fork features that must survive every upstream merge. If a marker is gone from the
          # merged tree, the merge silently ate fork code - abort and push nothing.
          # Declarations AND implementations - an option that still exists but is never read compiles
          # fine and ships a DMG with the feature silently doing nothing.
          FORK_MARKERS="\
          eSendBambuConnect|src/slic3r/GUI/MainFrame.hpp
          eSendBambuConnect|src/slic3r/GUI/MainFrame.cpp
          EVT_GLTOOLBAR_SEND_BAMBU_CONNECT|src/slic3r/GUI/GLToolbar.hpp
          on_action_send_bamcu_conect|src/slic3r/GUI/Plater.cpp
          minimal_chute_flush_length|src/libslic3r/PrintConfig.cpp
          minimal_chute_flush_length|src/libslic3r/Preset.cpp
          min_chute_purge|src/libslic3r/GCode.cpp
          seam_hide_at_interface|src/libslic3r/PrintConfig.cpp
          seam_point_is_embedded_enough|src/libslic3r/GCode/SeamPlacer.hpp
          seam_point_is_embedded_enough|src/libslic3r/GCode/SeamPlacer.cpp
          flush_into_infill_min_layer|src/libslic3r/PrintConfig.cpp
          flush_into_infill_min_layer|src/libslic3r/GCode/ToolOrdering.cpp
          interlocking_beam_bidirectional|src/libslic3r/PrintConfig.cpp
          interlocking_beam_gap|src/libslic3r/Feature/Interlocking/InterlockingGenerator.cpp
          seam_hide_at_interface|src/libslic3r/Preset.cpp
          interlocking_beam_gap|src/libslic3r/Preset.cpp
          flush_into_infill_min_layer|src/libslic3r/Preset.cpp
          seam_hide_at_interface|src/libslic3r/PrintObject.cpp
          interlocking_beam_gap|src/libslic3r/PrintObject.cpp
          flush_into_infill_min_layer|src/libslic3r/PrintObject.cpp
          minimal_chute_flush_length|src/libslic3r/Print.cpp
          minimal_chute_flush_length|src/slic3r/GUI/Tab.cpp
          interlocking_beam_gap|src/slic3r/GUI/ConfigManipulation.cpp"

          # Lists fork markers that are absent from the tree. Used both after a merge and on the
          # already-up-to-date path - a branch that lost fork code in an earlier run must not build
          # and ship green just because there is nothing new to merge.
          missing_fork_markers() {
            local marker file missing=""
            while IFS='|' read -r marker file; do
              marker=$(echo "$marker" | tr -d '[:space:]')
              file=$(echo "$file" | tr -d '[:space:]')
              [ -n "$marker" ] || continue
              if ! grep -qF "$marker" "$file" 2>/dev/null; then
                missing="${missing}  ${marker} (expected in ${file})"$'\n'
              fi
            done <<< "${FORK_MARKERS}"
            printf '%s' "$missing"
          }

          summary() { [ -n "${GITHUB_STEP_SUMMARY:-}" ] && echo "$1" >> "$GITHUB_STEP_SUMMARY"; return 0; }

          # Retry network operations - a transient fetch/push failure should not kill a 1h build.
          retry() {
            local attempts=$1 delay=$2 i=1; shift 2
            until "$@"; do
              if [ "$i" -ge "$attempts" ]; then
                echo "Command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "Attempt ${i}/${attempts} failed, retrying in ${delay}s: $*"
              sleep "$delay"; i=$((i + 1))
            done
          }

          echo "=== Configuring Git user ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Configuring remotes ==="
          # Do NOT put the token in the origin URL or a credential.helper: git config expands both at
          # write time, leaving a repo+workflow-scoped PAT in cleartext in .git/config - which nothing
          # cleans up, so on the self-hosted runner it persists indefinitely. The push below instead
          # uses the credential actions/checkout already installed from the same PAT
          # (http.https://github.com/.extraheader), which checkout's own post-job step removes.
          git config --local --unset-all credential.helper || true
          git remote add upstream https://github.com/SoftFever/OrcaSlicer.git 2>/dev/null \
            || git remote set-url upstream https://github.com/SoftFever/OrcaSlicer.git

          # A previous run killed mid-merge (cancelled job, runner reboot) can leave MERGE_HEAD
          # behind on a self-hosted runner. Clear it so this run starts from a clean state.
          if [ -e .git/MERGE_HEAD ] || [ -e .git/rebase-merge ] || [ -e .git/rebase-apply ]; then
            echo "Stale in-progress merge/rebase found - clearing"
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
          fi
          git reset --hard HEAD --quiet

          echo "=== Fetching upstream nightly-builds tag ==="
          retry 3 20 git fetch --force upstream refs/tags/nightly-builds:refs/tags/upstream-nightly || {
            echo "::error::Could not fetch the upstream nightly-builds tag (3 attempts). Network or GitHub outage."
            summary "## Upstream merge failed"
            summary "Could not fetch \`SoftFever/OrcaSlicer\` tag \`nightly-builds\` after 3 attempts - treat as a network/GitHub issue and re-run."
            exit 1
          }

          UPSTREAM_SHA=$(git rev-parse upstream-nightly)
          echo "Upstream nightly-builds SHA: ${UPSTREAM_SHA}"

          if git merge-base --is-ancestor "${UPSTREAM_SHA}" HEAD; then
            echo "Already up to date with upstream (${UPSTREAM_SHA:0:8})"
            MISSING=$(missing_fork_markers)
            if [ -n "${MISSING}" ]; then
              echo "::error::Branch is missing fork code - not building."
              echo "${MISSING}"
              summary "## Branch is missing fork code"
              summary "No upstream merge was needed, but these fork markers are absent from \`${BRANCH}\`:"
              summary '```'
              summary "${MISSING}"
              summary '```'
              exit 1
            fi
            summary "## Upstream merge"
            summary "Already up to date with upstream \`${UPSTREAM_SHA:0:8}\` - building the current branch state."
            exit 0
          fi

          # Up to 3 rounds: a round is only retried when the push races another push to the
          # branch, in which case we resync onto the new tip and redo the merge from there.
          MERGED=0
          for round in 1 2 3; do
            echo "=== Merging upstream ${UPSTREAM_SHA:0:8} into ${BRANCH} (round ${round}) ==="
            if ! git merge "${UPSTREAM_SHA}" --no-commit --no-ff; then
              CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)

              # Do NOT auto-resolve. This previously ran `git checkout --ours` on every
              # conflicted file, which silently discarded upstream's side, pushed the
              # result to nightly-builds-with-bc, and still exited green. Each merge then
              # started from that poisoned state and lost more upstream code. Abort
              # instead: nothing is pushed, nothing is lost, and a human resolves it.
              echo "::error::Upstream merge conflict - branch NOT updated, nothing pushed. Resolve locally, then re-run."
              summary "## Upstream merge conflict"
              summary ""
              summary "Nothing was pushed and no build ran. Branch \`${BRANCH}\` is untouched."
              summary ""
              summary "Upstream tag \`nightly-builds\` = \`${UPSTREAM_SHA}\`"
              summary ""
              summary "### Conflicted files"
              echo "Conflicted files:"
              while IFS= read -r f; do
                [ -n "$f" ] || continue
                HUNKS=$(grep -c '^<<<<<<< ' "$f" 2>/dev/null || true)
                echo "  ${f} (${HUNKS:-?} conflict hunk(s))"
                summary "- \`${f}\` - ${HUNKS:-?} conflict hunk(s)"
              done <<< "${CONFLICTED_FILES}"

              summary ""
              summary "### Upstream commits touching those files"
              # shellcheck disable=SC2086
              UPSTREAM_COMMITS=$(git log --oneline --no-merges -15 HEAD..${UPSTREAM_SHA} -- ${CONFLICTED_FILES} 2>/dev/null)
              echo "Upstream commits touching those files:"
              echo "${UPSTREAM_COMMITS}"
              summary '```'
              summary "${UPSTREAM_COMMITS:-(none)}"
              summary '```'

              summary ""
              summary "### Resolve locally"
              summary '```bash'
              summary "git fetch upstream refs/tags/nightly-builds:refs/tags/upstream-nightly --force"
              summary "git merge ${UPSTREAM_SHA}"
              summary "# keep BOTH sides - fork changes should be append-only overrides, never in-place"
              summary "# edits of upstream lines (in-place edits are what makes this conflict recur)"
              summary "git push origin ${BRANCH}"
              summary '```'

              git merge --abort
              echo ""
              echo "To resolve locally:"
              echo "  git fetch upstream refs/tags/nightly-builds:refs/tags/upstream-nightly --force"
              echo "  git merge ${UPSTREAM_SHA}"
              echo "  git push origin ${BRANCH}"
              exit 1
            fi

            echo "=== Verifying fork features survived the merge ==="
            MISSING=$(missing_fork_markers)
            if [ -n "${MISSING}" ]; then
              # Diagnostics BEFORE the abort: if `git merge --abort` itself fails the step dies here,
              # and the operator must still learn that fork code was dropped.
              echo "::error::Merge result is missing fork code - branch NOT updated, nothing pushed."
              echo "Missing markers:"
              echo "${MISSING}"
              summary "## Upstream merge dropped fork code"
              summary "The merge of \`${UPSTREAM_SHA:0:8}\` resolved cleanly but these fork markers vanished, so it was aborted and nothing was pushed:"
              summary '```'
              summary "${MISSING}"
              summary '```'
              git merge --abort
              exit 1
            fi

            if ! git commit -m "Merge upstream nightly-builds tag (${UPSTREAM_SHA:0:8})"; then
              echo "::error::git commit of the merge failed - nothing pushed."
              git merge --abort 2>/dev/null || true
              exit 1
            fi

            # Push HEAD explicitly: "git push origin <branch>" resolves a local ref, so on a detached
            # HEAD it reports "Everything up-to-date", exits 0, and we would publish an unpushed tree.
            if git push origin "HEAD:refs/heads/${BRANCH}"; then
              MERGED=1
              break
            fi

            echo "Push rejected - ${BRANCH} moved while this job was merging. Resyncing and retrying."
            retry 3 10 git fetch origin "${BRANCH}" || true
            git reset --hard "origin/${BRANCH}" --quiet
          done

          if [ "${MERGED}" -ne 1 ]; then
            echo "::error::Could not push the upstream merge after 3 rounds - branch NOT updated."
            summary "## Upstream merge could not be pushed"
            summary "Merged cleanly but \`git push\` kept being rejected (branch moving underneath). Re-run the workflow."
            exit 1
          fi

          echo "Merge successful"
          summary "## Upstream merge"
          summary "Merged upstream \`${UPSTREAM_SHA:0:8}\` into \`${BRANCH}\` and pushed."

      - name: Get date and version
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          ver="V${ver_pure}-nightly"
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash
      
      # Cache handling
      - name: Generate cache key
        id: cache_key
        run: |
          # The key must identify the toolchain, not just the deps sources: the self-hosted Mac
          # (Command Line Tools, macOS 26) and the cloud macos-14 image (Xcode 15) would otherwise
          # share one entry and silently hand each other binaries built against a different SDK.
          echo "cache-key=${{ runner.environment }}-macos$(sw_vers -productVersion | cut -d. -f1)-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}" >> $GITHUB_OUTPUT
          echo "cache-path=${{ github.workspace }}/deps/build" >> $GITHUB_OUTPUT
      
      - name: Load cached deps
        id: cache_deps
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache_key.outputs.cache-path }}
          key: ${{ steps.cache_key.outputs.cache-key }}
      
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
      
      # Build dependencies if cache miss
      - name: Install build tools
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          brew install automake texinfo libtool
          brew list
          brew uninstall --ignore-dependencies zstd
      
      - name: Build dependencies
        id: build_deps
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          # Explicitly set SDKROOT so autotools-based deps (e.g. GMP)
          # can find libSystem at link time. Xcode 15's new linker fails
          # with "ld: library 'System' not found" otherwise.
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          ls -la "$(dirname "$SDKROOT")"
          ./build_release_macos.sh -dx -a arm64 -1
          cd "${{ github.workspace }}/deps/build/arm64"
          find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +
          brew install zstd

      - name: Dump GMP config.log on failure
        if: failure() && steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== xcode-select -p ==="
          xcode-select -p || true
          echo "=== xcrun --show-sdk-path ==="
          xcrun --show-sdk-path || true
          echo "=== which cc / cc --version ==="
          which cc || true
          /Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/cc --version || true
          echo "=== GMP config.log (full, with conftest details) ==="
          CFG=deps/build/arm64/dep_GMP-prefix/src/dep_GMP/config.log
          if [ -f "$CFG" ]; then
            wc -l "$CFG"
            grep -nE "conftest|error:|warning:|fatal|cannot|undefined|gmp_compile_test|configure:[0-9]+:" "$CFG" | head -200
            echo "---- first 600 lines ----"
            head -600 "$CFG"
          else
            echo "no config.log at $CFG"
          fi
      
      - name: Install tools for build
        run: |
          brew install libtool
          mkdir -p ${{ github.workspace }}/deps/build

      - name: Free disk space
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1

      - name: Build OrcaSlicer
        working-directory: ${{ github.workspace }}
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          ./build_release_macos.sh -s -n -x -a arm64 -1

      - name: Sign app and notarize
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          # Set up certificate and keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p $KEYCHAIN_PASSWORD $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P $P12_PASSWORD -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Sign the apps
          # codesign --deep is deprecated and cannot sign the bundled Python
          # runtime (see relocate_python_runtime in build_release_macos.sh).
          # Sign every nested Mach-O in the bundle explicitly -- notarization
          # requires the hardened-runtime signature on each -- then seal the
          # bundle itself last, and verify so coverage gaps fail at CI time
          # rather than at notarization.
          ENTITLEMENTS=${{ github.workspace }}/scripts/disable_validation.entitlements
          sign() {
            codesign --force --options runtime --timestamp --entitlements "$ENTITLEMENTS" --sign "$CERTIFICATE_ID" "$@"
          }
          sign_app() {
            local app="$1"
            local machos=()
            # file is batched via xargs (per-file it costs minutes); universal
            # binaries also print per-architecture lines, dropped by grep -v.
            while IFS= read -r f; do machos+=("$f"); done < <(
              find "$app" -type f -print0 |
                xargs -0 file --no-pad --mime-type -- |
                grep -v ' (for architecture ' |
                grep ': application/x-mach-binary$' |
                sed 's|: application/x-mach-binary$||'
            )
            if [ "${#machos[@]}" -eq 0 ]; then
              echo "ERROR: no Mach-O files found in $app -- detection is broken" >&2
              exit 1
            fi
            echo "signing ${#machos[@]} Mach-O files in $app"
            sign "${machos[@]}"
            sign --verbose "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          }
          sign_app "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer.app"

          # Sign OrcaSlicer_profile_validator.app if it exists
          if [ -f "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            sign_app "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app"
          fi

          # Create main OrcaSlicer DMG
          mkdir -p ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg
          rm -rf ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/*
          cp -R ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/
          ln -sfn /Applications ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/Applications

          # Ensure all file operations are complete
          sync
          sleep 2

          hdiutil create -volname "OrcaSlicer" -srcfolder ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg -ov -format UDZO OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg
          codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg

          # Create separate OrcaSlicer_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/
            ln -sfn /Applications ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/Applications

            # Ensure all file operations are complete
            sync
            sleep 2

            hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg -ov -format UDZO OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
            codesign --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          fi

          # Notarize main DMG
          xcrun notarytool store-credentials "notarytool-profile" --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" --team-id "${{ secrets.TEAM_ID }}" --password "${{ secrets.APP_PWD }}"
          xcrun notarytool submit "OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg" --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg

          # Notarize profile validator DMG if it exists
          if [ -f "OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg" ]; then
            xcrun notarytool submit "OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg" --keychain-profile "notarytool-profile" --wait
            xcrun stapler staple OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_arm64_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg
          if-no-files-found: error

      - name: Upload profile validator DMG
        uses: actions/upload-artifact@v7
        with:
          name: OrcaSlicer_Mac_arm64_profile_validator_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          if-no-files-found: ignore

  release:
    name: Deploy to Release
    needs: [build_mac_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout nightly-builds-with-bc
        uses: actions/checkout@v5
        with:
          ref: nightly-builds-with-bc
      
      - name: Get version and SHA
        id: get_version
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          echo "version=${ver_pure}" >> $GITHUB_OUTPUT
          git_sha=$(git rev-parse HEAD)
          echo "sha=${git_sha}" >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Mac_arm64_*
          merge-multiple: true
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "Contents of artifacts directory:"
          ls -la ./artifacts/
          echo "Looking for DMG files:"
          find ./artifacts -name "*.dmg" -type f

      - name: Delete old release and create new one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing release if it exists
          echo "Checking for existing nightly-mac-arm64 release..."
          if gh release view nightly-mac-arm64 2>/dev/null; then
            echo "Deleting existing nightly-mac-arm64 release..."
            gh release delete nightly-mac-arm64 --yes --cleanup-tag || true
          fi

          # Create fresh release with DMG files
          echo "Creating new nightly-mac-arm64 release..."
          gh release create nightly-mac-arm64 \
            --title "Nightly Mac ARM64 Build" \
            --latest \
            --notes "Automated nightly build from nightly-builds-with-bc branch (synced with upstream)

          **Version:** ${{ steps.get_version.outputs.version }}
          **Branch SHA:** ${{ steps.get_version.outputs.sha }}

          This build includes:
          - Latest changes from upstream OrcaSlicer nightly-builds tag
          - Custom modifications from nightly-builds-with-bc branch

          Built for macOS (ARM64 only - Apple Silicon).

          **Note:** These builds are signed and notarized by Apple. You can install and run them directly without any security warnings." \
            ./artifacts/*.dmg

