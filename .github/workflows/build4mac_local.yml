name: Build Mac ARM64 (Local Self-Hosted)

on:
  schedule:
    - cron: '0 2 1,5,9,13,17,21,25,29 * *' # Run every 4 days at 2 AM UTC (temporarily moved here from build4mac.yml)
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner override (auto = probe for self-hosted macOS ARM64, fall back to macos-14)'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - self-hosted
          - macos-14

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  pick-runner:
    name: Pick build runner
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.check.outputs.labels }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          RUNNER_OVERRIDE: ${{ inputs.runner }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          case "${RUNNER_OVERRIDE:-auto}" in
            self-hosted)
              echo 'labels=["self-hosted","macOS","ARM64"]' >> "$GITHUB_OUTPUT"
              echo "Manual override: self-hosted"
              exit 0
              ;;
            macos-14)
              echo 'labels=["macos-14"]' >> "$GITHUB_OUTPUT"
              echo "Manual override: macos-14"
              exit 0
              ;;
          esac
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'labels=["macos-14"]' >> "$GITHUB_OUTPUT"
            echo "PAT_TOKEN not set — falling back to macos-14"
            exit 0
          fi
          # Probe the repo's runners API for an online, idle self-hosted Mac ARM64.
          # Short timeout so this never adds more than ~10s when no SH runner exists.
          ONLINE=$(timeout 10s gh api "repos/${REPO}/actions/runners" --jq \
            '[.runners[] | select(.status=="online" and .busy==false and ([.labels[].name] | contains(["self-hosted","macOS","ARM64"])))] | length' \
            2>/dev/null || echo "")
          if [ -n "$ONLINE" ] && [ "$ONLINE" -gt 0 ] 2>/dev/null; then
            echo 'labels=["self-hosted","macOS","ARM64"]' >> "$GITHUB_OUTPUT"
            echo "Self-hosted macOS ARM64 runners online and idle: $ONLINE — using self-hosted"
          else
            echo 'labels=["macos-14"]' >> "$GITHUB_OUTPUT"
            echo "No idle self-hosted macOS ARM64 runners — falling back to macos-14"
          fi

  build_mac_arm64:
    name: Build Mac ARM64
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    permissions:
      contents: write
    env:
      date:
      ver:
      ver_pure:
    
    steps:
      - name: Validate PAT token secret
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::PAT_TOKEN secret is not set. Create a PAT with 'repo' and 'workflow' scopes and add it as PAT_TOKEN in repository secrets."
            echo "Repository secrets: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - name: Checkout nightly-builds-with-bc branch
        uses: actions/checkout@v5
        with:
          ref: nightly-builds-with-bc
          fetch-depth: 0
          lfs: 'true'
          token: ${{ secrets.PAT_TOKEN }}
          
      - name: Fetch and merge upstream nightly-builds
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -x  # Enable command echoing

          echo "=== Configuring Git user ==="
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "=== Configuring Git remote with PAT ==="
          # First, show the current remote URL (will be sanitized in logs)
          echo "Current origin URL:"
          git remote get-url origin

          # Remove the trailing .git if it exists in the repository name
          REPO_URL="https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}"

          # Set the new URL with PAT token (without .git extension to match checkout)
          git remote set-url origin "${REPO_URL}"

          # Verify it was set (GitHub Actions will automatically sanitize the token in logs)
          echo "Updated origin URL (token will be hidden):"
          git remote get-url origin

          # Configure git credential helper to use the token stored in memory
          git config --local --unset-all credential.helper || true
          git config --local credential.helper '!f() { echo "username=x-access-token"; echo "password=${PAT_TOKEN}"; }; f'

          echo "=== Adding upstream remote ==="
          git remote add upstream https://github.com/SoftFever/OrcaSlicer.git || true

          echo "=== Fetching upstream nightly-builds tag ==="
          git fetch upstream refs/tags/nightly-builds:refs/tags/upstream-nightly

          echo "=== Getting upstream SHA ==="
          UPSTREAM_SHA=$(git rev-parse upstream-nightly)
          echo "Upstream nightly-builds SHA: ${UPSTREAM_SHA}"

          echo "=== Checking if already merged ==="
          if git merge-base --is-ancestor ${UPSTREAM_SHA} HEAD; then
            echo "Already up to date with upstream"
          else
            echo "=== Attempting merge ==="
            if git merge ${UPSTREAM_SHA} --no-commit --no-ff; then
              echo "=== Clean merge detected - committing ==="
              git commit -m "Merge upstream nightly-builds tag (${UPSTREAM_SHA:0:8})"

              echo "=== Pushing to nightly-builds-with-bc ==="
              git push origin nightly-builds-with-bc
              echo "Merge successful"
            else
              echo "=== Merge conflicts detected ==="

              echo "=== Getting list of conflicted files ==="
              CONFLICTED_FILES=$(git diff --name-only --diff-filter=U)
              echo "Conflicted files:"
              echo "$CONFLICTED_FILES"

              echo "=== Resolving conflicts by keeping our versions ==="
              git diff --name-only --diff-filter=U | while read file; do
                echo "Keeping our version of: $file"
                git checkout --ours "$file"
                git add "$file"
              done

              echo "=== Committing partial merge ==="
              git commit -m "Partial merge of upstream nightly-builds (${UPSTREAM_SHA:0:8}) - conflicts pending"
              PARTIAL_MERGE_SHA=$(git rev-parse HEAD)
              echo "Partial merge SHA: ${PARTIAL_MERGE_SHA}"

              echo "=== Pushing partial merge to nightly-builds-with-bc ==="
              git push origin nightly-builds-with-bc

              echo "=== Creating conflict branch for PR ==="
              CONFLICT_BRANCH="merge-conflict-$(date +%Y%m%d-%H%M%S)"
              echo "Conflict branch name: ${CONFLICT_BRANCH}"
              git checkout -b "$CONFLICT_BRANCH" HEAD~1

              echo "=== Re-attempting merge to show conflicts ==="
              git merge ${UPSTREAM_SHA} --no-commit --no-ff || true

              echo "=== Committing conflicts for PR ==="
              git commit -a -m "WIP: Merge conflicts from upstream nightly-builds (${UPSTREAM_SHA:0:8})"

              echo "=== Pushing conflict branch ==="
              git push origin "$CONFLICT_BRANCH"

              echo "=== Switching back to nightly-builds-with-bc ==="
              git checkout nightly-builds-with-bc

              echo "=== Creating PR for conflict resolution ==="
              gh pr create \
                --base nightly-builds-with-bc \
                --head "$CONFLICT_BRANCH" \
                --title "Resolve merge conflicts from upstream nightly-builds ($(date +%Y-%m-%d))" \
                --body "Automated merge from upstream encountered conflicts in the following files:

              \`\`\`
              $CONFLICTED_FILES
              \`\`\`

              **Upstream SHA:** ${UPSTREAM_SHA}

              The nightly-builds-with-bc branch has been updated with all non-conflicting changes. This PR contains the conflicted files for manual resolution.

              Please review and resolve the conflicts, then merge this PR." || echo "PR creation failed - may already exist"

              echo "Continuing build with non-conflicting changes applied"
            fi
          fi

          set +x  # Disable command echoing

      - name: Get date and version
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          ver="V${ver_pure}-nightly"
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash
      
      # Cache handling
      - name: Generate cache key
        id: cache_key
        run: |
          echo "cache-key=macos-14-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}" >> $GITHUB_OUTPUT
          echo "cache-path=${{ github.workspace }}/deps/build" >> $GITHUB_OUTPUT
      
      # Split restore/save so we can save the cache even when later steps fail
      # (default 'actions/cache' post step is gated on success()).
      - name: Load cached deps
        id: cache_deps
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.cache_key.outputs.cache-path }}
          key: ${{ steps.cache_key.outputs.cache-key }}
      
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"  # use most recent 3.28.x version
      
      # Build dependencies if cache miss
      - name: Install build tools
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: |
          brew install automake texinfo libtool
          brew list
          if brew list --formula zstd &>/dev/null; then
            brew uninstall --ignore-dependencies zstd
          fi
      
      - name: Build dependencies
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          # Explicitly set SDKROOT so autotools-based deps (e.g. GMP)
          # can find libSystem at link time. Xcode 15's new linker fails
          # with "ld: library 'System' not found" otherwise.
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          ls -la "$(dirname "$SDKROOT")"
          ./build_release_macos.sh -dx -a arm64 -1
          cd "${{ github.workspace }}/deps/build/arm64"
          # Spotlight/Finder can race the cleanup by writing .DS_Store into
          # the dirs we're deleting, producing "Directory not empty" errors.
          # Sweep .DS_Store first and retry once.
          find . -name .DS_Store -delete 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} + 2>/dev/null || true
          find . -name .DS_Store -delete 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name 'OrcaSlicer_dep' -exec rm -rf {} +
          brew install zstd

      - name: Dump GMP config.log on failure
        if: failure() && steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== xcode-select -p ==="
          xcode-select -p || true
          echo "=== xcrun --show-sdk-path ==="
          xcrun --show-sdk-path || true
          echo "=== which cc / cc --version ==="
          which cc || true
          /Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/cc --version || true
          echo "=== GMP config.log (full, with conftest details) ==="
          CFG=deps/build/arm64/dep_GMP-prefix/src/dep_GMP/config.log
          if [ -f "$CFG" ]; then
            wc -l "$CFG"
            grep -nE "conftest|error:|warning:|fatal|cannot|undefined|gmp_compile_test|configure:[0-9]+:" "$CFG" | head -200
            echo "---- first 600 lines ----"
            head -600 "$CFG"
          else
            echo "no config.log at $CFG"
          fi
      
      # Save the rebuilt deps cache even if a later step (sign/notarize) fails.
      - name: Save deps cache
        if: always() && steps.cache_deps.outputs.cache-hit != 'true' && steps.cache_key.outputs.cache-key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.cache_key.outputs.cache-path }}
          key: ${{ steps.cache_key.outputs.cache-key }}

      - name: Install tools for build
        run: |
          brew install libtool
          mkdir -p ${{ github.workspace }}/deps/build

      - name: Free disk space
        # Cloud macos-14 ships with 7 Xcodes (~50–60 GB total); the build needs space.
        # Skip on self-hosted so we don't delete the runner Mac's Xcode installs or wipe its simulator caches.
        if: runner.environment == 'github-hosted'
        run: |
          df -hI /dev/disk3s1s1
          sudo find /Applications -maxdepth 1 -type d -name "Xcode_*.app" ! -name "Xcode_15.4.app" -exec rm -rf {} +
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/*
          df -hI /dev/disk3s1s1

      - name: Build OrcaSlicer
        working-directory: ${{ github.workspace }}
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          ./build_release_macos.sh -s -n -x -a arm64 -1

      - name: Sign app and notarize
        working-directory: ${{ github.workspace }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          CERTIFICATE_ID: ${{ secrets.MACOS_CERTIFICATE_ID }}
        run: |
          # Mirror all stdout/stderr to a local file on the runner so the
          # failure trace survives even when API log download requires admin.
          # NOTE: do not enable 'set -x' here — it would expand secret values
          # into the local file (GitHub only redacts cloud-uploaded logs).
          DEBUG_LOG=/tmp/orca-sign-debug.log
          : > "$DEBUG_LOG"
          exec > >(tee -a "$DEBUG_LOG") 2>&1
          echo "=== sign step started: $(date -u +%FT%TZ) ==="
          # ERR trap identifies the failing line/command without printing secrets.
          trap 'rc=$?; echo "ERR at line $LINENO (rc=$rc): $BASH_COMMAND"' ERR

          # Sanity checks (presence only, never values).
          echo "Pre-checks:"
          for v in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD CERTIFICATE_ID RUNNER_TEMP; do
            eval "val=\$$v"
            if [ -n "$val" ]; then echo "  $v: SET (${#val} chars)"; else echo "  $v: EMPTY"; fi
          done
          echo "  OrcaSlicer.app present: $([ -d "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer.app" ] && echo yes || echo NO)"
          echo "  macOS: $(sw_vers -productVersion 2>/dev/null) on $(uname -m)"

          # Capture user keychain search list so we can restore on exit.
          # 'security list-keychain -d user -s' REPLACES the list, and a failure
          # mid-step would leave the runner Mac unable to find login.keychain.
          ORIG_KCS=()
          while IFS= read -r path; do
            [ -n "$path" ] && ORIG_KCS+=("$path")
          done < <(security list-keychains -d user | awk -F'"' '/"/ {print $2}')
          echo "Original user keychain search list (${#ORIG_KCS[@]} entries):"
          for k in "${ORIG_KCS[@]}"; do echo "  - $k"; done

          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Restore keychain list on any exit so we never strand the host.
          restore_keychains() {
            set +e
            if [ ${#ORIG_KCS[@]} -gt 0 ]; then
              security list-keychains -d user -s "${ORIG_KCS[@]}"
            fi
            if [ -f "$KEYCHAIN_PATH" ]; then
              security delete-keychain "$KEYCHAIN_PATH" || true
            fi
          }
          trap restore_keychains EXIT

          # Clear any leftover keychain file from a prior failed run.
          [ -f "$KEYCHAIN_PATH" ] && security delete-keychain "$KEYCHAIN_PATH"

          echo "Decoding certificate ($(echo -n "$BUILD_CERTIFICATE_BASE64" | wc -c | tr -d ' ') base64 chars)..."
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo "  -> p12 size: $(stat -f%z "$CERTIFICATE_PATH") bytes"
          echo "Creating keychain..."
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Setting keychain settings..."
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          echo "Unlocking keychain..."
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Importing certificate..."
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          echo "Setting keychain as primary (prepended to original list)..."
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIG_KCS[@]}"

          # codesign needs the full chain (leaf -> intermediate -> root).
          # With --keychain, only the named keychain is searched for chain
          # certs (man codesign), so we need to include the Apple Root CA too.
          INTERMEDIATES_DIR="$RUNNER_TEMP/apple-intermediates"
          mkdir -p "$INTERMEDIATES_DIR"
          for cert_url in \
            https://www.apple.com/appleca/AppleIncRootCertificate.cer \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            https://www.apple.com/certificateauthority/DeveloperIDCA.cer; do
            fname=$(basename "$cert_url")
            echo "Fetching $fname..."
            curl -fsSL -o "$INTERMEDIATES_DIR/$fname" "$cert_url"
            echo "Importing $fname into temp keychain..."
            security import "$INTERMEDIATES_DIR/$fname" -k "$KEYCHAIN_PATH" -A -t cert -f x509 || true
            security add-certificates -k "$KEYCHAIN_PATH" "$INTERMEDIATES_DIR/$fname" 2>&1 || true
          done

          # NOTE: 'security add-trusted-cert' prompts for interactive admin
          # authorization on macOS and hangs forever on a non-interactive
          # runner. Apple Root CA is already in System Roots, and we now have
          # it duplicated in the temp keychain for chain-building purposes —
          # that should be sufficient without explicit trust override.

          echo "--- Certs in temp keychain ---"
          security find-certificate -a "$KEYCHAIN_PATH" | grep -E "labl|alis" | sort -u
          echo "--- Verify leaf cert chain ---"
          # Find the imported leaf cert (Developer ID Application) and write to file
          LEAF_PEM="$RUNNER_TEMP/leaf.pem"
          security find-certificate -c "Developer ID Application" -p "$KEYCHAIN_PATH" > "$LEAF_PEM" 2>&1 || true
          if [ -s "$LEAF_PEM" ]; then
            echo "Running: security verify-cert -k $KEYCHAIN_PATH -c $LEAF_PEM -p codeSign"
            security verify-cert -k "$KEYCHAIN_PATH" -c "$LEAF_PEM" -p codeSign 2>&1 || echo "verify-cert returned non-zero"
          else
            echo "No leaf cert found in temp keychain (find-certificate empty)"
          fi
          echo "--- Identities visible to codesign ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
          echo "--- End diagnostics ---"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $P12_PASSWORD $KEYCHAIN_PATH

          # Sign the apps
          codesign --keychain "$KEYCHAIN_PATH" --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer.app

          # Sign OrcaSlicer_profile_validator.app if it exists
          if [ -f "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            codesign --keychain "$KEYCHAIN_PATH" --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app
          fi

          # Create main OrcaSlicer DMG
          mkdir -p ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg
          rm -rf ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/*
          cp -R ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer.app ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/
          ln -sfn /Applications ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg/Applications

          # Ensure all file operations are complete
          sync
          sleep 2

          hdiutil create -volname "OrcaSlicer" -srcfolder ${{ github.workspace }}/build/arm64/OrcaSlicer_dmg -ov -format UDZO OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg
          codesign --keychain "$KEYCHAIN_PATH" --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg

          # Create separate OrcaSlicer_profile_validator DMG if the app exists
          if [ -f "${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app/Contents/MacOS/OrcaSlicer_profile_validator" ]; then
            mkdir -p ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg
            rm -rf ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/*
            cp -R ${{ github.workspace }}/build/arm64/OrcaSlicer/OrcaSlicer_profile_validator.app ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/
            ln -sfn /Applications ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg/Applications

            # Ensure all file operations are complete
            sync
            sleep 2

            hdiutil create -volname "OrcaSlicer Profile Validator" -srcfolder ${{ github.workspace }}/build/arm64/OrcaSlicer_profile_validator_dmg -ov -format UDZO OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
            codesign --keychain "$KEYCHAIN_PATH" --deep --force --verbose --options runtime --timestamp --entitlements ${{ github.workspace }}/scripts/disable_validation.entitlements --sign "$CERTIFICATE_ID" OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          fi

          # Notarize main DMG
          # Disable ERR trap around xcrun so the trap doesn't print the
          # expanded command (which embeds the app-specific password) to the
          # local /tmp debug log on failure.
          trap - ERR
          # Store credentials in our temp keychain (the default is login.keychain
          # which on a non-interactive runner can't be unlocked → "User
          # interaction is not allowed.").
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "${{ secrets.APPLE_DEV_ACCOUNT }}" \
            --team-id "${{ secrets.TEAM_ID }}" \
            --password "${{ secrets.APP_PWD }}" \
            --keychain "$KEYCHAIN_PATH"
          xcrun notarytool submit "OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg" \
            --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg

          # Notarize profile validator DMG if it exists
          if [ -f "OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg" ]; then
            xcrun notarytool submit "OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg" \
              --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
            xcrun stapler staple OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_Mac_arm64_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_Mac_arm64_${{ env.ver }}.dmg

      - name: Upload profile validator DMG
        uses: actions/upload-artifact@v5
        with:
          name: OrcaSlicer_Mac_arm64_profile_validator_${{ env.ver }}
          path: ${{ github.workspace }}/OrcaSlicer_profile_validator_Mac_arm64_${{ env.ver }}.dmg
          if-no-files-found: ignore

  release:
    name: Deploy to Release
    needs: [build_mac_arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout nightly-builds-with-bc
        uses: actions/checkout@v5
        with:
          ref: nightly-builds-with-bc
      
      - name: Get version and SHA
        id: get_version
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          echo "version=${ver_pure}" >> $GITHUB_OUTPUT
          git_sha=$(git rev-parse HEAD)
          echo "sha=${git_sha}" >> $GITHUB_OUTPUT
      
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: OrcaSlicer_Mac_arm64_*
          merge-multiple: true
          path: ./artifacts

      - name: List downloaded artifacts
        run: |
          echo "Contents of artifacts directory:"
          ls -la ./artifacts/
          echo "Looking for DMG files:"
          find ./artifacts -name "*.dmg" -type f

      - name: Delete old release and create new one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the existing release if it exists
          echo "Checking for existing nightly-mac-arm64 release..."
          if gh release view nightly-mac-arm64 2>/dev/null; then
            echo "Deleting existing nightly-mac-arm64 release..."
            gh release delete nightly-mac-arm64 --yes --cleanup-tag || true
          fi

          # Create fresh release with DMG files
          echo "Creating new nightly-mac-arm64 release..."
          gh release create nightly-mac-arm64 \
            --title "Nightly Mac ARM64 Build" \
            --latest \
            --notes "Automated nightly build from nightly-builds-with-bc branch (synced with upstream)

          **Version:** ${{ steps.get_version.outputs.version }}
          **Branch SHA:** ${{ steps.get_version.outputs.sha }}

          This build includes:
          - Latest changes from upstream OrcaSlicer nightly-builds tag
          - Custom modifications from nightly-builds-with-bc branch

          Built for macOS (ARM64 only - Apple Silicon).

          **Note:** These builds are signed and notarized by Apple. You can install and run them directly without any security warnings." \
            ./artifacts/*.dmg

